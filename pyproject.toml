[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-agent"
version = "0.1.0"
description = "Kubernetes incident-response agent: root-cause analysis with LangGraph, human-approved remediation, MCP server, ITBench evals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Omid Beigi" }]
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "starlette>=0.37",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
incident-agent = "incident_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
